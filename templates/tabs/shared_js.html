<script>
  {%- raw %}
const TOOLTIPS = {
  annualMargin: {
    title: "ANNUAL PROFIT MARGIN",
    desc: "How much of annual revenue becomes net income.",
    formula: "Annual Net Income ÷ Annual Revenue"
  },
  qMargin: {
    title: "QUARTERLY PROFIT MARGIN",
    desc: "Same as annual margin but for the latest quarter.",
    formula: "Latest Q Net Income ÷ Latest Q Revenue"
  },
  netCash: {
    title: "NET CASH",
    desc: "Cash remaining after paying off all debt. Positive = net cash positive.",
    formula: "Total Cash − Total Debt"
  },
  fcf: {
    title: "FREE CASH FLOW (FCF)",
    desc: "Cash generated after capital expenditures. Latest quarter.",
    formula: "Operating Cash Flow − CapEx"
  },
  capex: {
    title: "CAPITAL EXPENDITURE",
    desc: "Money spent on physical assets like mines and equipment. Latest quarter.",
    formula: "From cash flow statement"
  },
  ocf: {
    title: "OPERATING CASH FLOW",
    desc: "Cash generated from core business operations. Latest quarter.",
    formula: "From cash flow statement"
  },
  revenueQoQ: {
    title: "REVENUE QoQ",
    desc: "Current quarter vs previous quarter.",
    formula: "(Q0 − Q1) ÷ |Q1|"
  },
  revenueYoY: {
    title: "REVENUE YoY",
    desc: "Current quarter vs same quarter last year (Q0 vs Q4).",
    formula: "(Q0 − Q4) ÷ |Q4|"
  },
  netIncomeQoQ: {
    title: "NET INCOME QoQ",
    desc: "Current quarter vs previous quarter.",
    formula: "(Q0 − Q1) ÷ |Q1|"
  },
  netIncomeYoY: {
    title: "NET INCOME YoY",
    desc: "Current quarter vs same quarter last year (Q0 vs Q4).",
    formula: "(Q0 − Q4) ÷ |Q4|"
  },
  annualYoY1: {
    title: "ANNUAL YoY (Y0 vs Y1)",
    desc: "Most recent full year vs prior full year.",
    formula: "(Y0 − Y1) ÷ |Y1|"
  },
  annualYoY2: {
    title: "ANNUAL YoY (Y1 vs Y2)",
    desc: "Prior full year vs two years ago.",
    formula: "(Y1 − Y2) ÷ |Y2|"
  },
  fcfQoQ: {
    title: "FCF QoQ",
    desc: "Free cash flow: current quarter vs previous quarter.",
    formula: "(Q0 FCF − Q1 FCF) ÷ |Q1 FCF|"
  },
  fcfYoY: {
    title: "FCF YoY",
    desc: "Free cash flow: current quarter vs same quarter last year.",
    formula: "(Q0 FCF − Q4 FCF) ÷ |Q4 FCF|"
  },
  marginRank: {
    title: "MARGIN RANK",
    desc: "Ranked by annual profit margin across all watchlist peers.",
    formula: "#1 = highest annual profit margin"
  },
  netCashRank: {
    title: "NET CASH RANK",
    desc: "Ranked by net cash position across all watchlist peers.",
    formula: "#1 = highest (Cash − Debt)"
  },
  marketCapRank: {
    title: "MARKET CAP RANK",
    desc: "Ranked by market capitalization across all watchlist peers.",
    formula: "#1 = largest market cap"
  },
  fcfRank: {
    title: "FCF RANK",
    desc: "Ranked by latest quarterly free cash flow across all watchlist peers.",
    formula: "#1 = highest FCF"
  },
};

const popup = document.getElementById('tooltipPopup');

function showTooltip(el, key, vals) {
  const t = TOOLTIPS[key];
  if (!t) return;
  document.getElementById('ttTitle').textContent = t.title;
  document.getElementById('ttDesc').textContent = t.desc;
  let formulaText = t.formula;
  if (vals) formulaText += '\n\nCalculation:\n' + vals;
  document.getElementById('ttFormula').textContent = formulaText;
  popup.classList.add('visible');
  positionTooltip(el);
}

function hideTooltip() {
  popup.classList.remove('visible');
}

function positionTooltip(el) {
  const rect = el.getBoundingClientRect();
  const pw = 280;
  let left = rect.right + 8;
  let top = rect.top - 10;
  if (left + pw > window.innerWidth) left = rect.left - pw - 8;
  if (top + 100 > window.innerHeight) top = window.innerHeight - 120;
  popup.style.left = left + 'px';
  popup.style.top = top + 'px';
}

function infoIcon(key, vals) {
  const v = vals ? `,'${String(vals).replace(/'/g, "\\'")}'` : '';
  return `<i class="info-icon" onclick="showTooltip(this,'${key}'${v})" onmouseleave="hideTooltip()">ⓘ</i>`;
}

function fmt(n) {
  if (n == null) return '—';
  const abs = Math.abs(n);
  if (abs >= 1e9) return (n/1e9).toFixed(2) + 'B';
  if (abs >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (abs >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return n.toFixed(2);
}
function fmtPct(n) {
  if (n == null) return '—';
  const val = (n * 100).toFixed(1);
  return (n >= 0 ? '+' : '') + val + '%';
}
function pctClass(n) {
  if (n == null) return 'neutral';
  return n >= 0 ? 'up' : 'down';
}
function sentimentClass(s) {
  if (!s) return 'sentiment-neutral';
  if (s.toLowerCase().includes('bull')) return 'sentiment-bullish';
  if (s.toLowerCase().includes('bear')) return 'sentiment-bearish';
  return 'sentiment-neutral';
}

// Collapsible Helper
function toggleSection(el) {
  const section = el.closest('.card-section');
  section.classList.toggle('expanded');
  const btn = section.querySelector('.section-toggle');
  if (section.classList.contains('expanded')) {
    btn.textContent = '−';
  } else {
    btn.textContent = '+';
  }
}

function sentimentBadgeClass(s) {
  if (!s) return 'neutral';
  s = s.toLowerCase();
  if (s === 'bullish' || s === 'positive') return 'positive';
  if (s === 'bearish' || s === 'negative') return 'negative';
  return 'neutral';
}

// ── GEMINI NEWS CHECK — popup that stays on top until closed with ✕ ──
// Shows after every news refresh (scheduled or button), whatever the result.
let _ncShownRunId = null;

function newsCheckBadge(ticker, map) {
  const r = (map || {})[ticker];
  if (!r) return '';
  const safe = String(ticker).replace(/'/g, "\\'");
  const deal = r.deal ? ` <span onclick="event.stopPropagation();openNewsCheck('${safe}')" title="Gemini: takeover/merger news — ${_escNews(r.dealNote || '')}. A pending buyout usually caps the upside near the deal price." style="cursor:pointer;font-size:13px;font-weight:800;padding:2px 6px;border-radius:4px;background:#a78bfa;color:#111;white-space:nowrap">🔒 DEAL</span>` : '';
  const rev = /reverse/i.test(r.splitNote || '');
  const split = r.split ? ` <span onclick="event.stopPropagation();openNewsCheck('${safe}')" title="Stock split: ${_escNews(r.splitNote || '')}" style="cursor:pointer;font-size:13px;font-weight:800;padding:2px 6px;border-radius:4px;background:${rev ? 'var(--down)' : 'var(--up)'};color:#111;white-space:nowrap">${rev ? '⚠ REV SPLIT' : '✂️ SPLIT'}</span>` : '';
  if (!r.negative) return deal + split;
  return deal + split + ` <span onclick="event.stopPropagation();openNewsCheck('${String(ticker).replace(/'/g, "\\'")}')" title="Gemini: negative news today — ${_escNews(r.category)} (severity ${r.severity}/5). Click for details."`
    + ` style="cursor:pointer;font-size:13px;font-weight:800;padding:2px 6px;border-radius:4px;background:var(--down);color:#fff;white-space:nowrap">⚠ ALERT ${r.severity}</span>`;
}

function buyVerdictBadge(ticker, held) {
  const r = (held || {})[ticker];
  if (!r) return '';
  const cfg = {agree: ['👍', 'var(--up)'], caution: ['⚠', '#fbbf24'], avoid: ['✋', 'var(--down)']}[r.verdict];
  if (!cfg) return '';
  const tip = `Gemini on this buy: ${r.verdict.toUpperCase()} — ${r.thesis}${(r.risks || []).length ? ' · Risks: ' + r.risks.join('; ') : ''}`;
  return ` <span onclick="event.stopPropagation();const s=document.getElementById('buyReviewSection');if(s)s.scrollIntoView({behavior:'smooth'})" title="${_escNews(tip)}"`
    + ` style="cursor:pointer;font-size:13px;font-weight:800;padding:2px 6px;border-radius:4px;border:1px solid ${cfg[1]};color:${cfg[1]};white-space:nowrap">${cfg[0]} ${r.verdict.toUpperCase()}</span>`;
}

function _ncEventsHtml(rec) {
  const tk = (rec.takeovers || []), sn = (rec.splitNews || []), sc = (rec.splitCalendar || []);
  if (!tk.length && !sn.length && !sc.length) return '';
  const who = e => e.role === 'held' ? '<b style="color:var(--accent)">HELD</b>' : e.role ? '<b style="color:var(--accent)">CANDIDATE</b>'
    : e.inUniverse ? `in your universe · Dream ${e.dream ?? '?'}` : '<span style="color:var(--muted)">not in your universe</span>';
  const links = e => (e.headlines || []).slice(0, 2).map(h => h.url ? `<a href="${_escNews(h.url)}" target="_blank" rel="noopener" style="color:var(--muted);font-size:13px">${_escNews(h.title)}</a>` : '').filter(Boolean).join(' · ');
  const stageCol = s => ({agreed: 'var(--up)', bid: '#fbbf24', talks: '#fbbf24', rumor: 'var(--muted)', completed: 'var(--muted)'}[s] || 'var(--muted)');
  let html = `<div style="border:1px solid #a78bfa;border-left:5px solid #a78bfa;border-radius:6px;padding:8px 12px;margin-bottom:14px">
    <div style="font-weight:800;font-size:16px;margin-bottom:6px">📣 TAKEOVERS &amp; STOCK SPLITS <span style="font-weight:400;color:var(--muted);font-size:13px">· market-wide · flags only</span></div>`;
  if (tk.length) {
    html += '<div style="font-size:14px;font-weight:700;letter-spacing:1px;color:#a78bfa;margin:4px 0">🔒 TAKEOVER TARGETS</div>'
      + tk.map(e => `<div style="font-size:15px;margin:3px 0"><b>${_escNews(e.ticker || '?')}</b> ${_escNews(e.company)}
          <span style="font-weight:700;color:${stageCol(e.stage)}"> ${_escNews((e.stage || '?').toUpperCase())}</span>
          ${e.acquirer ? ' · by ' + _escNews(e.acquirer) : ''}${e.pricePerShare ? ' · ' + _escNews(e.pricePerShare) : ''}${e.premium ? ' (' + _escNews(e.premium) + ' premium)' : ''}
          · ${who(e)}<div style="font-size:13px;color:var(--muted)">${_escNews(e.note)} ${links(e)}</div></div>`).join('')
      + '<div style="font-size:13px;color:var(--muted);margin-bottom:6px">Agreed deals usually jump at the announcement and then trade near the deal price; the upside is mostly in the rumour/talks stage, with the risk the deal never comes.</div>';
  }
  const splits = [...sn.map(e => ({...e, src: 'news'})), ...sc.filter(c => !sn.some(n => n.ticker && n.ticker === c.ticker)).map(e => ({...e, src: 'calendar'}))];
  const main = splits.filter(e => !e.otc), otc = splits.filter(e => e.otc);
  const row = e => `<div style="font-size:15px;margin:3px 0">${e.kind === 'reverse' ? '<span style="color:var(--down);font-weight:800">⚠ REVERSE</span>' : '<span style="color:var(--up);font-weight:800">✂️ FORWARD</span>'}
      <b>${_escNews(e.ticker || '?')}</b> ${_escNews(e.company)} · ${_escNews(e.ratio)}${(e.payDate || e.date) ? ' · ' + _escNews(e.payDate || e.date) : ''}
      · ${who(e)} <span style="color:var(--muted);font-size:13px">(${e.src})</span>${e.src === 'news' && links(e) ? `<div style="font-size:13px">${links(e)}</div>` : ''}</div>`;
  if (splits.length) {
    html += '<div style="font-size:14px;font-weight:700;letter-spacing:1px;color:#a78bfa;margin:8px 0 4px">✂️ STOCK SPLITS</div>'
      + (main.length ? main.map(row).join('') : '<div style="font-size:14px;color:var(--muted)">none on regular listings</div>')
      + (otc.length ? `<div style="margin-top:4px"><span style="cursor:pointer;color:var(--accent);font-size:14px" onclick="const b=this.nextElementSibling;const o=b.style.display!=='none';b.style.display=o?'none':'block';this.textContent=(o?'▸':'▾')+' ${otc.length} on OTC / foreign listings'">▸ ${otc.length} on OTC / foreign listings</span><div style="display:none">${otc.map(row).join('')}</div></div>` : '')
      + '<div style="font-size:13px;color:var(--muted);margin-top:4px">Reverse splits are mostly struggling small companies — a warning, not an opportunity.</div>';
  }
  return html + '</div>';
}

function _ncMarketHtml(m) {
  if (!m) return '';
  const col = m.riskLevel === 'high' ? 'var(--down)' : m.riskLevel === 'elevated' ? '#fbbf24' : 'var(--up)';
  if (m.status !== 'ok') return `<div style="border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-bottom:12px;font-size:15px;color:var(--muted)">🌐 Market risk read unavailable: ${_escNews(m.error)}</div>`;
  const flagged = new Set(m.flagged || []);
  const heads = (m.headlines || []).map((h, i) => ({h, i})).filter(x => flagged.has(x.i + 1))
    .map(({h}) => `<div style="font-size:14px;margin-left:4px">· ${h.url ? `<a href="${_escNews(h.url)}" target="_blank" rel="noopener" style="color:var(--text)">${_escNews(h.title)}</a>` : _escNews(h.title)} <span style="color:var(--muted);font-size:13px">${_escNews(h.provider)} · ${h.time}</span></div>`).join('');
  const ev = (m.events || []).map(e => `<li style="margin:2px 0"><b>${_escNews(e.event)}</b>${e.when ? ` <span style="color:var(--muted)">(${_escNews(e.when)})</span>` : ''} — ${_escNews(e.impact)}</li>`).join('');
  return `<div style="border:1px solid ${col};border-left:5px solid ${col};border-radius:6px;padding:8px 12px;margin-bottom:14px">
      <div style="font-weight:800;font-size:16px">🌐 MARKET RISK TODAY: <span style="color:${col}">${_escNews((m.riskLevel || '?').toUpperCase())}</span>
      <span style="font-weight:400;color:var(--muted);font-size:13px"> · read at ${_escNews(m.asOf)} from ${(m.headlines || []).length} market headlines</span></div>
      <div style="font-size:15px;margin:4px 0">${_escNews(m.summary)}</div>
      ${ev ? `<ul style="margin:4px 0 4px 18px;padding:0;font-size:15px">${ev}</ul>` : ''}${heads}</div>`;
}

function marketRiskBanner(m) {
  if (!m || m.status !== 'ok' || !m.riskLevel) return '';
  const col = m.riskLevel === 'high' ? 'var(--down)' : m.riskLevel === 'elevated' ? '#fbbf24' : 'var(--up)';
  return `<div onclick="openNewsCheck()" title="Gemini's read of today's market-wide headlines — click for events" style="cursor:pointer;border:1px solid ${col};border-radius:8px;padding:6px 12px;margin-bottom:10px;font-size:15px">
      🌐 Market risk today: <b style="color:${col}">${_escNews(m.riskLevel.toUpperCase())}</b> — ${_escNews(m.summary)} <span style="color:var(--muted);font-size:13px">(${(m.events || []).length} event${(m.events || []).length === 1 ? '' : 's'} · click)</span></div>`;
}

function _ncModal() {
  let m = document.getElementById('newsCheckModal');
  if (m) return m;
  m = document.createElement('div');
  m.id = 'newsCheckModal';
  // No click-outside close: it stays until the ✕ is pressed.
  m.style.cssText = 'display:none;position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,0.6);align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto';
  m.innerHTML = `<div style="background:var(--surface, #111827);border:2px solid var(--accent);border-radius:10px;max-width:860px;width:100%;padding:16px 18px;box-shadow:0 10px 40px rgba(0,0,0,0.6)">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
        <div><div style="font-family:'Syne',sans-serif;font-weight:800;font-size:20px;letter-spacing:1px;color:var(--accent)">🤖 GEMINI NEWS CHECK</div>
        <div id="newsCheckSub" style="font-size:14px;color:var(--muted);margin-top:2px"></div></div>
        <button onclick="closeNewsCheck()" title="Close" style="font-size:20px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text);cursor:pointer;padding:2px 10px">✕</button>
      </div>
      <div id="newsCheckBody" style="margin-top:12px"></div></div>`;
  document.body.appendChild(m);
  return m;
}

function _ncRowHtml(r) {
  const role = `<span style="font-size:12px;padding:1px 6px;border-radius:4px;border:1px solid var(--border);color:var(--muted);margin-left:6px">${r.role === 'held' ? 'HELD' : 'CANDIDATE'}</span>`;
  if (r.state === 'negative') {
    const sevColor = r.severity >= 4 ? 'var(--down)' : r.severity >= 3 ? '#f97316' : '#fbbf24';
    const flagged = new Set(r.flagged || []);
    const heads = (r.headlines || []).map((h, i) => {
      const hit = flagged.has(i + 1);
      return `<div style="font-size:15px;margin:3px 0 0 4px;${hit ? '' : 'opacity:0.65'}">${hit ? '⚠️ ' : '· '}`
        + (h.url ? `<a href="${_escNews(h.url)}" target="_blank" rel="noopener" style="color:${hit ? 'var(--text)' : 'var(--muted)'}">${_escNews(h.title)}</a>` : _escNews(h.title))
        + ` <span style="color:var(--muted);font-size:13px">${_escNews(h.provider)} · ${h.time}</span></div>`;
    }).join('');
    return `<div id="nc-${_escNews(r.ticker)}" style="border:1px solid ${sevColor};border-left:5px solid ${sevColor};border-radius:6px;padding:8px 10px;margin-bottom:8px;background:rgba(248,113,113,0.06)">
        <div><span style="font-size:18px">⚠️</span> <b style="font-family:'Syne',sans-serif;font-size:17px">${_escNews(r.ticker)}</b>${role}
        <span style="margin-left:8px;font-weight:800;color:${sevColor}">NEGATIVE · severity ${r.severity}/5</span>
        <span style="color:var(--muted);font-size:14px"> · ${_escNews(r.category)} · ${_escNews(r.confidence)} confidence</span></div>
        <div style="font-size:16px;margin:4px 0 2px">${_escNews(r.reason)}</div>${heads}</div>`;
  }
  const chip = (txt, color) => `<span id="nc-${_escNews(r.ticker)}" style="display:inline-block;margin:0 6px 6px 0;padding:3px 8px;border:1px solid var(--border);border-radius:5px;font-size:15px"><b>${_escNews(r.ticker)}</b>${role} <span style="color:${color};font-size:13px">${txt}</span></span>`;
  if (r.state === 'clear') return chip(`✓ ${r.newsCount} headline${r.newsCount === 1 ? '' : 's'}${r.reason ? ' — ' + _escNews(r.reason) : ''}`, 'var(--up)');
  if (r.state === 'error') return chip('not analysed' + (r.reason ? ' — ' + _escNews(r.reason) : ''), 'var(--down)');
  return chip('no news', 'var(--muted)');
}

function _renderNewsCheck(rec, scrollTo) {
  const m = _ncModal();
  const c = rec.counts || {};
  document.getElementById('newsCheckSub').textContent =
    `${rec.runAt || ''} · ${rec.trigger === 'scheduler' ? 'scheduled' : 'manual'} run · headlines ${rec.window || 'today'} · ${rec.geminiCalled ? rec.model : 'Gemini not called (no news today)'}${rec.usage ? ` · Gemini today ${rec.usage.used}/${rec.usage.cap}` : ''}`;
  const rows = rec.tickers || [];
  const group = (state, title, color, block) => {
    const g = rows.filter(r => r.state === state);
    return `<div style="margin-bottom:12px"><div style="font-size:14px;font-weight:700;letter-spacing:1px;color:${color};margin-bottom:6px">${title} (${g.length})</div>`
      + (g.length ? (block ? g.map(_ncRowHtml).join('') : `<div>${g.map(_ncRowHtml).join('')}</div>`) : '<div style="color:var(--muted);font-size:15px">none</div>') + '</div>';
  };
  let html = _ncMarketHtml(rec.market) + _ncEventsHtml(rec);
  if (rec.status === 'error') html += `<div style="border:1px solid var(--down);color:var(--down);border-radius:6px;padding:8px 10px;margin-bottom:12px;font-size:15px">Gemini analysis failed: ${_escNews(rec.error)}</div>`;
  html += `<div style="font-size:16px;margin-bottom:12px">${c.negative ? `<b style="color:var(--down)">⚠️ ${c.negative} ticker${c.negative === 1 ? '' : 's'} with negative news today</b>` : '<b style="color:var(--up)">✓ No negative news today</b>'}
      <span style="color:var(--muted)"> · ${c.clear || 0} with news, nothing negative · ${c.no_news || 0} with no news today${c.error ? ' · ' + c.error + ' not analysed' : ''}</span></div>`;
  html += group('negative', '⚠️ NEGATIVE NEWS TODAY', 'var(--down)', true);
  const deals = rows.filter(r => r.deal);
  if (deals.length) html += `<div style="margin-bottom:12px"><div style="font-size:14px;font-weight:700;letter-spacing:1px;color:#a78bfa;margin-bottom:6px">🔒 TAKEOVER / MERGER (${deals.length})</div>`
    + deals.map(r => `<div style="border:1px solid #a78bfa;border-radius:6px;padding:6px 10px;margin-bottom:6px;font-size:15px"><b>${_escNews(r.ticker)}</b> <span style="font-size:12px;color:var(--muted)">${r.role === 'held' ? 'HELD' : 'CANDIDATE'}</span> — ${_escNews(r.dealNote || r.reason)}`
      + (r.role === 'held' ? '' : ' <span style="color:#a78bfa">· upside likely capped near the deal price</span>') + '</div>').join('') + '</div>';
  if (c.error) html += group('error', 'NOT ANALYSED', 'var(--down)', false);
  html += group('clear', '✓ NO NEGATIVE NEWS TODAY', 'var(--up)', false);
  html += group('no_news', 'NO NEWS TODAY', 'var(--muted)', false);
  html += '<div style="font-size:13px;color:var(--muted)">Headline-only judgement — flags only, nothing is bought or sold on it. Before 09:30 the window reaches back to the previous close, so overnight news is included.</div>';
  document.getElementById('newsCheckBody').innerHTML = html;
  m.dataset.runId = rec.runId || '';
  m.style.display = 'flex';
  if (scrollTo) { const el = document.getElementById('nc-' + scrollTo); if (el && el.scrollIntoView) el.scrollIntoView({block: 'center'}); }
}

async function checkNewsCheck() {
  try {
    const rec = await fetch('/news/check?t=' + Date.now(), {cache: 'no-store'}).then(r => r.json());
    if (!rec || !rec.runId || rec.acked) return;
    const m = document.getElementById('newsCheckModal');
    if (m && m.style.display === 'flex' && m.dataset.runId === rec.runId) return;  // already up
    _renderNewsCheck(rec);
  } catch (e) {
    console.error('[NewsCheck] poll FAIL:', e);
  }
}

async function openNewsCheck(scrollTo) {
  try {
    const rec = await fetch('/news/check?t=' + Date.now(), {cache: 'no-store'}).then(r => r.json());
    if (!rec || !rec.runId) { alert('No Gemini news check has run yet — press 📰 REFRESH NEWS.'); return; }
    _renderNewsCheck(rec, scrollTo);
  } catch (e) {
    console.error('[NewsCheck] open FAIL:', e);
  }
}

async function closeNewsCheck() {
  const m = document.getElementById('newsCheckModal');
  if (!m) return;
  m.style.display = 'none';
  try {
    await fetch('/news/check/ack', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({runId: m.dataset.runId})});
  } catch (e) {
    console.error('[NewsCheck] ack FAIL:', e);
  }
}

setTimeout(checkNewsCheck, 1500);
setInterval(checkNewsCheck, 60000);

// ── NEWS — headlines with links only (no AI analysis) ─────────────────────
// Stored headlines come from /news/headlines/<ticker>; they're refreshed at
// 09:20, 11:47 and 14:47 and by the TradeAI REFRESH NEWS button.
function _newsAgo(iso) {
  const t = Date.parse(iso || '');
  if (!t) return '';
  const h = (Date.now() - t) / 3600000;
  return h < 1 ? 'just now' : h < 24 ? Math.floor(h) + 'h ago' : Math.floor(h / 24) + 'd ago';
}

function _escNews(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
}

function _newsListHtml(items, limit) {
  const esc = _escNews;
  if (!items || !items.length) return '<div style="color:var(--muted);font-size:16px">No news in the last 7 days.</div>';
  return items.slice(0, limit || items.length).map(n => `<div style="padding:6px 0;border-bottom:1px solid var(--border)">
      <a href="${esc(n.url || '#')}" target="_blank" rel="noopener" style="color:var(--text);font-size:16px;text-decoration:none">${esc(n.title)}</a>
      <div style="font-size:14px;color:var(--muted);margin-top:2px">${esc(n.provider)}${n.provider ? ' · ' : ''}${_newsAgo(n.pubDate)}</div>
    </div>`).join('');
}

async function openNewsModal(ticker) {
  const modal = document.getElementById('newsModal');
  const body = document.getElementById('newsBody');
  document.getElementById('newsTitle').textContent = ticker + ' — RECENT NEWS';
  document.getElementById('newsSubtitle').textContent = 'Loading...';
  body.innerHTML = '';
  modal.classList.add('visible');
  try {
    const d = await fetch('/news/headlines/' + encodeURIComponent(ticker)).then(r => r.json());
    document.getElementById('newsSubtitle').textContent =
      `${(d.items || []).length} headline${(d.items || []).length === 1 ? '' : 's'}, last 7 days · updated ${d.fetchedAt || 'never'}`;
    body.innerHTML = _newsListHtml(d.items);
  } catch (e) {
    body.innerHTML = '<div style="color:var(--down)">Failed to load news.</div>';
    console.error('[News] modal FAIL:', ticker, e);
  }
}

// ── OPTIONS — daily put/call snapshot (recorded at 17:15 by run_options_snapshot)
function _pcColor(r) {
  if (r == null) return 'var(--muted)';
  return r >= 1.0 ? 'var(--down)' : r <= 0.7 ? 'var(--up)' : '#fbbf24';
}

function _pcLabel(r) {
  if (r == null) return '';
  return r >= 1.0 ? 'put-heavy · bearish lean' : r <= 0.7 ? 'call-heavy · bullish lean' : 'balanced';
}

function _optionsHtml(ticker, hist) {
  const box = (inner) => `<div style="border:2px solid var(--accent);border-radius:8px;padding:12px 14px;margin:4px 0 14px;background:rgba(255,255,255,0.02)">${inner}</div>`;
  const head = (sub) => `<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <span style="font-family:'Syne',sans-serif;font-weight:800;font-size:17px;letter-spacing:1px;color:var(--accent)">📊 OPTIONS — PUT / CALL</span>
      <span style="font-size:14px;color:var(--muted)">${sub}</span></div>`;
  const recs = (hist || []).filter(h => h.callVolume != null);
  if (!recs.length) {
    const last = (hist || [])[0];
    const why = !last ? 'No options recorded yet — the snapshot runs daily at 17:15 (Admin → Options snapshot → RUN NOW).'
      : last.noOptions ? (ticker.endsWith('.TO') ? 'No US-listed twin with options — TSX options themselves aren\'t available from Yahoo.' : 'Yahoo lists no options for this ticker.')
      : 'Last snapshot failed: ' + _escNews(last.error || 'unknown');
    return box(head('') + `<div style="color:var(--muted);font-size:16px">${why}</div>`);
  }
  const d = recs[0];
  const via = d.usSymbol && d.usSymbol !== ticker ? ` · via ${_escNews(d.usSymbol)} (US listing)` : '';
  const n = (v) => v == null ? '—' : Number(v).toLocaleString();
  const tile = (label, val, color, sub) => `<div style="flex:1 1 110px;min-width:110px">
      <div style="font-size:13px;color:var(--muted);letter-spacing:1px">${label}</div>
      <div style="font-family:'DM Mono',monospace;font-size:22px;font-weight:800;color:${color || 'var(--text)'}">${val}</div>
      ${sub ? `<div style="font-size:13px;color:${color || 'var(--muted)'}">${sub}</div>` : ''}</div>`;
  const pc = d.putCallVolumeRatio;
  let html = head(`as of ${d.date}${via}`)
    + `<div style="display:flex;gap:12px;flex-wrap:wrap">`
    + tile('P/C VOLUME', pc != null ? pc.toFixed(2) : '—', _pcColor(pc), _pcLabel(pc))
    + tile('P/C OPEN INT.', d.putCallOIRatio != null ? d.putCallOIRatio.toFixed(2) : '—', _pcColor(d.putCallOIRatio))
    + tile('CALLS TRADED', n(d.callVolume), 'var(--up)')
    + tile('PUTS TRADED', n(d.putVolume), 'var(--down)')
    + tile('IMPLIED VOL', d.atmIV != null ? (d.atmIV * 100).toFixed(1) + '%' : '—', null, 'at-the-money, nearest expiry')
    + tile('UNUSUAL', n(d.unusualCount || 0), (d.unusualCount || 0) > 0 ? '#fbbf24' : null, 'vol ≥100 and &gt;2× open int.')
    + `</div>`;
  if (recs.length > 1) {
    const days = recs.slice(0, 10).reverse();
    html += `<div style="margin-top:10px;font-size:14px;color:var(--muted)">P/C volume, last ${days.length} days: `
      + days.map(h => `<span title="${h.date}" style="font-family:'DM Mono',monospace;color:${_pcColor(h.putCallVolumeRatio)};margin-right:6px">${h.putCallVolumeRatio != null ? h.putCallVolumeRatio.toFixed(2) : '—'}</span>`).join('')
      + `</div>`;
  }
  const un = (d.unusual || []).slice(0, 5);
  if (un.length) {
    html += `<div style="margin-top:10px;font-size:14px;color:var(--muted);letter-spacing:1px">TOP UNUSUAL CONTRACTS</div>`
      + `<table style="width:100%;font-size:14px;font-family:'DM Mono',monospace;border-collapse:collapse;margin-top:4px">`
      + `<tr style="color:var(--muted)"><td>side</td><td>strike</td><td>expiry</td><td style="text-align:right">volume</td><td style="text-align:right">open int.</td><td style="text-align:right">IV</td></tr>`
      + un.map(u => `<tr><td style="color:${u.side === 'call' ? 'var(--up)' : 'var(--down)'};font-weight:700">${u.side.toUpperCase()}</td><td>${u.strike}</td><td>${u.expiration}</td>`
        + `<td style="text-align:right">${n(u.volume)}</td><td style="text-align:right">${n(u.openInterest)}</td><td style="text-align:right">${u.iv != null ? (u.iv * 100).toFixed(0) + '%' : '—'}</td></tr>`).join('')
      + `</table>`;
  }
  html += `<div style="margin-top:8px;font-size:13px;color:var(--muted)">Sentiment reference only — history began 2026-10-01; not yet tested as a predictor.</div>`;
  return box(html);
}

async function loadTickerOptions(ticker, elId) {
  const el = document.getElementById(elId);
  if (!el) return;
  try {
    const d = await fetch('/options/' + encodeURIComponent(ticker) + '?days=30').then(r => r.json());
    el.innerHTML = _optionsHtml(ticker, d.history);
  } catch (e) {
    el.innerHTML = '<div style="color:var(--down);font-size:16px">Failed to load options.</div>';
    console.error('[Options] load FAIL:', ticker, e);
  }
}

// ── Ticker extras — OPTIONS on top, RECENT NEWS at the bottom, wrapped around
// any ticker detail. Rendered as empty placeholders (the Dream table builds
// ~630 hidden details up front); fillTickerExtras(root) loads the ones inside
// root once it's actually visible.
let _tickerExtrasSeq = 0;
function tickerExtrasWrap(ticker, innerHtml) {
  const t = String(ticker).replace(/"/g, '');
  return `<div class="tx-options" data-ticker="${t}" style="padding:0 16px"></div>`
    + innerHtml
    + `<div style="margin-top:14px;border-top:1px solid var(--border);padding:10px 16px 0">`
    + `<div style="font-family:'Syne',sans-serif;font-weight:700;font-size:15px;letter-spacing:1px;color:var(--muted);margin-bottom:6px">RECENT NEWS</div>`
    + `<div class="tx-news" data-ticker="${t}" style="color:var(--muted);font-size:16px">Loading news...</div></div>`;
}

function fillTickerExtras(root) {
  if (!root) return;
  root.querySelectorAll('.tx-options:not([data-loaded]), .tx-news:not([data-loaded])').forEach(el => {
    el.dataset.loaded = '1';
    if (!el.id) el.id = 'tx-extra-' + (++_tickerExtrasSeq);
    if (el.classList.contains('tx-options')) {
      el.innerHTML = '<div style="color:var(--muted);font-size:16px">Loading options...</div>';
      loadTickerOptions(el.dataset.ticker, el.id);
    } else {
      loadTickerNews(el.dataset.ticker, el.id);
    }
  });
}

async function loadTickerNews(ticker, elId) {
  const el = document.getElementById(elId || ('ticker-news-' + ticker));
  if (!el) return;
  try {
    const d = await fetch('/news/headlines/' + encodeURIComponent(ticker)).then(r => r.json());
    const items = d.items || [];
    el.innerHTML = _newsListHtml(items, 6)
      + `<div style="font-size:14px;color:var(--muted);margin-top:6px">updated ${d.fetchedAt || 'never'}`
      + (items.length > 6 ? ` · <a href="#" onclick="openNewsModal('${ticker}');return false" style="color:var(--accent)">view all ${items.length}</a>` : '')
      + '</div>';
  } catch (e) {
    el.innerHTML = '<div style="color:var(--down);font-size:16px">Failed to load news.</div>';
    console.error('[News] inline FAIL:', ticker, e);
  }
}

function renderWatchlist(data) {
  const stocks = data.watchlist || [];
  if (!stocks.length) return '<div class="loading">No data yet. Click FETCH DATA.</div>';

  const summaryHTML = `
    <div class="summary-row">
      <div class="summary-card">
        <div class="label">STOCKS TRACKED</div>
        <div class="value">${stocks.length}</div>
        <div class="sub">in watchlist</div>
      </div>
      <div class="summary-card">
        <div class="label">TOTAL MARKET CAP</div>
        <div class="value">$${fmt(stocks.reduce((a,s)=>a+(s.marketCap||0),0))}</div>
        <div class="sub">combined</div>
      </div>
      <div class="summary-card">
        <div class="label">BEST MARGIN</div>
        <div class="value">${(() => { const s = stocks.find(s=>s.marginRank===1); return s ? s.ticker : '—'; })()}</div>
        <div class="sub">${(() => { const s = stocks.find(s=>s.marginRank===1); return s ? fmtPct(s.annualProfitMargin) : '—'; })()} annual</div>
      </div>
      <div class="summary-card">
        <div class="label">BEST NET CASH</div>
        <div class="value">${(() => { const s = stocks.find(s=>s.netCashRank===1); return s ? s.ticker : '—'; })()}</div>
        <div class="sub">$${(() => { const s = stocks.find(s=>s.netCashRank===1); return s ? fmt(s.netCash) : '—'; })()} net</div>
      </div>
    </div>`;

  const cardsHTML = stocks.map(s => {
    const priceFetchedAt = s.priceFetchedAt || s.fetchedAt || '—';
    const prevClose = s.previousClose != null ? `$${s.previousClose.toFixed(2)}` : '—';
    const todayPrice = s.price != null ? s.price.toFixed(2) : '—';
    const priceDiff = (s.price != null && s.previousClose != null) ? s.price - s.previousClose : null;
    const priceDiffPct = (priceDiff != null && s.previousClose) ? (priceDiff / s.previousClose * 100) : null;
    const priceColor = priceDiff == null ? 'var(--text)' : priceDiff >= 0 ? 'var(--up)' : 'var(--down)';
    const diffLabel = priceDiffPct != null ? ` (${priceDiffPct >= 0 ? '+' : ''}${priceDiffPct.toFixed(2)}%)` : '';
    const tabId = 'ticker-' + s.ticker.replace('.', '_');
    const rsiBg = s.rsi14 < 30 ? 'rgba(74,222,128,0.15);color:var(--up);border:1px solid rgba(74,222,128,0.3)' : s.rsi14 > 70 ? 'rgba(248,113,113,0.15);color:var(--down);border:1px solid rgba(248,113,113,0.3)' : 'var(--surface2);color:var(--muted);border:1px solid var(--border)';
    const bbBg  = s.bbPercent < 0 ? 'rgba(74,222,128,0.15);color:var(--up);border:1px solid rgba(74,222,128,0.3)' : s.bbPercent > 1 ? 'rgba(248,113,113,0.15);color:var(--down);border:1px solid rgba(248,113,113,0.3)' : 'var(--surface2);color:var(--muted);border:1px solid var(--border)';
    const rsiBadge = s.rsi14 != null ? '<span style="font-size:10px;font-family:monospace;padding:2px 8px;border-radius:4px;font-weight:700;background:' + rsiBg + '">RSI ' + s.rsi14 + '</span>' : '';
    const bbBadge  = s.bbPercent != null ? '<span style="font-size:10px;font-family:monospace;padding:2px 8px;border-radius:4px;font-weight:700;background:' + bbBg + '">BB% ' + s.bbPercent.toFixed(2) + '</span>' : '';

    const insiderBg = s.insiderNet === 'Net Buyer' ? 'rgba(74,222,128,0.15);color:var(--up);border:1px solid rgba(74,222,128,0.3)' : s.insiderNet === 'Net Seller' ? 'rgba(248,113,113,0.15);color:var(--down);border:1px solid rgba(248,113,113,0.3)' : 'var(--surface2);color:var(--muted);border:1px solid var(--border)';
    const insiderBadge = s.insiderNet ? '<span style="font-size:10px;font-family:monospace;padding:2px 8px;border-radius:4px;font-weight:700;background:' + insiderBg + '">👤 ' + s.insiderNet + '</span>' : '';
    const shortBg = s.shortFloat != null && s.shortFloat > 20 ? 'rgba(248,113,113,0.15);color:var(--down);border:1px solid rgba(248,113,113,0.3)' : 'var(--surface2);color:var(--muted);border:1px solid var(--border)';
    const shortBadge = s.shortFloat != null ? '<span style="font-size:10px;font-family:monospace;padding:2px 8px;border-radius:4px;font-weight:700;background:' + shortBg + '">Short ' + s.shortFloat + '%</span>' : '';
    const instBadge = s.institutionalPct != null ? '<span style="font-size:10px;font-family:monospace;padding:2px 8px;border-radius:4px;font-weight:700;background:var(--surface2);color:var(--muted);border:1px solid var(--border)">🏦 ' + s.institutionalPct + '%</span>' : '';

    return `
    <div class="slim-card" onclick="showTickerTab('${s.ticker}')">
      <div class="slim-card-header">
        <div>
          <div class="slim-ticker">${s.ticker}</div>
          <div class="slim-industry">${s.industry || s.sector || '—'}</div>
          <div class="slim-mcap">MCap: $${fmt(s.marketCap)}</div>
        </div>
      </div>
      <div class="slim-prices">
        <div class="slim-price-block">
          <div class="slim-price-label">PREV CLOSE</div>
          <div class="slim-price-value" style="color:var(--muted)">${prevClose}</div>
        </div>
        <div class="slim-price-block">
          <div class="slim-price-label">TODAY${diffLabel}</div>
          <div class="slim-price-value" style="color:${priceColor}">$${todayPrice}</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin:8px 0 4px 0;flex-wrap:wrap">
        ${rsiBadge}${bbBadge}${insiderBadge}${shortBadge}${instBadge}
      </div>
      <div class="slim-actions">
        <span class="slim-fetch-ts">🕐 ${priceFetchedAt}</span>
        <div style="display:flex;gap:6px">
          <button class="btn-refresh-price" onclick="event.stopPropagation();refreshTickerPrice('${s.ticker}', this)">↺ Price</button>
          <button class="btn-detail" onclick="event.stopPropagation();showTickerTab('${s.ticker}')">Detail →</button>
        </div>
      </div>
    </div>`;
  }).join('');

  return summaryHTML + `<div class="watchlist-grid-4">${cardsHTML}</div>`;
}


function renderGainersTable(gainers) {
  if (!gainers.length) return '<div class="loading" style="padding:40px">No gainers data available for this market.</div>';
  return `
    <table class="gainers-table">
      <thead>
        <tr>
          <th>#</th>
          <th>TICKER</th>
          <th>% GAIN</th>
          <th>PRICE</th>
          <th>VOLUME</th>
          <th>ACTION</th>
        </tr>
      </thead>
      <tbody>
        ${gainers.map((g,i)=>`
        <tr>
          <td class="rank-num">${i+1}</td>
          <td><strong>${g.ticker}</strong></td>
          <td class="gain-pct">+${g.percentGain?.toFixed(2)||'—'}%</td>
          <td>$${g.price?.toFixed(2)||'—'}</td>
          <td>${fmt(g.volume)}</td>
          <td>
            <form method="POST" action="/add" style="display:inline">
              <input type="hidden" name="ticker" value="${g.ticker}">
              <button type="submit" class="btn" style="padding: 2px 8px; font-size: 10px;">+ WATCH</button>
            </form>
          </td>
        </tr>`).join('')}
      </tbody>
    </table>`;
}

function switchGainersMarket(market, btn) {
  gainersMarket = market;
  document.querySelectorAll('.gainers-toggle-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const data = window._lastGainersData;
  if (!data) return;
  const gainers = market === 'cdn' ? (data.dailyGainersCDN || []) : (data.dailyGainers || []);
  document.getElementById('gainersTableContainer').innerHTML = renderGainersTable(gainers);
}

function renderGainers(data) {
  window._lastGainersData = data;
  const cdnGainers = data.dailyGainersCDN || [];
  const usGainers = data.dailyGainers || [];
  const active = gainersMarket === 'cdn' ? cdnGainers : usGainers;
  return `
    <div class="gainers-toggle">
      <button class="gainers-toggle-btn ${gainersMarket === 'cdn' ? 'active' : ''}"
        onclick="switchGainersMarket('cdn', this)">🍁 TSX (Canada)</button>
      <button class="gainers-toggle-btn ${gainersMarket === 'us' ? 'active' : ''}"
        onclick="switchGainersMarket('us', this)">🇺🇸 US Market</button>
      <span style="font-size:11px;color:var(--muted);align-self:center;margin-left:4px">
        CDN: ${cdnGainers.length} · US: ${usGainers.length}
      </span>
    </div>
    <div id="gainersTableContainer">${renderGainersTable(active)}</div>`;
}

function renderRecommendations(data) {
  const rec = data.recommendations || {};
  const list = rec.recommendations || [];
  if (!list.length) return '<div class="loading">No recommendations yet — click FETCH ALL to generate.</div>';
  return `
    <div class="market-context"><strong>MARKET CONTEXT:</strong> ${rec.marketContext || '—'}</div>
    <div class="rec-grid">
      ${list.map(r => `
      <div class="rec-card">
        <div class="rec-header">
          <div>
            <div class="rec-ticker">${r.ticker}</div>
            <div class="rec-company">${r.companyName || ''}</div>
          </div>
          <form method="POST" action="/add" style="display:inline">
            <input type="hidden" name="ticker" value="${r.ticker}">
            <button type="submit" class="btn" style="padding:4px 10px;font-size:10px">+ WATCH</button>
          </form>
        </div>
        <div class="rec-badges">
          <span class="rec-badge risk-${(r.riskLevel||'medium').toLowerCase()}">${(r.riskLevel||'').toUpperCase()} RISK</span>
          <span class="rec-badge">${r.sector || ''}</span>
          <span class="rec-badge">${r.timeHorizon || ''}</span>
        </div>
        <div class="rec-reason">${r.reason || ''}</div>
        ${r.catalysts && r.catalysts.length ? `
        <ul class="rec-catalysts">
          ${r.catalysts.map(c=>`<li>${c}</li>`).join('')}
        </ul>` : ''}
      </div>`).join('')}
    </div>`;
}

function renderPeers(data) {
  const stocks = data.watchlist || [];
  if (!stocks.length) return '<div class="loading">No data yet.</div>';

  const categories = [
    { key: 'annualProfitMargin', rankKey: 'marginRank', label: 'PROFIT MARGIN', fmt: v => v != null ? (v*100).toFixed(1)+'%' : '—' },
    { key: 'netCash', rankKey: 'netCashRank', label: 'NET CASH', fmt: v => '$'+fmt(v) },
    { key: 'marketCap', rankKey: 'marketCapRank', label: 'MARKET CAP', fmt: v => '$'+fmt(v) },
    { key: 'latestFCF', rankKey: 'fcfRank', label: 'FREE CASH FLOW', fmt: v => '$'+fmt(v) },
  ];

  return `<div class="peer-grid">${categories.map(cat => {
    const sorted = [...stocks].filter(s=>s[cat.key]!=null).sort((a,b)=>b[cat.key]-a[cat.key]);
    return `
    <div class="peer-card">
      <div class="peer-title">${cat.label}</div>
      ${sorted.map((s,i)=>`
      <div class="peer-row">
        <span class="peer-rank r${i+1}">${i+1}</span>
        <span class="peer-ticker">${s.ticker}</span>
        <span class="peer-val">${cat.fmt(s[cat.key])}</span>
      </div>`).join('')}
    </div>`;
  }).join('')}</div>`;
}

function showTab(name, el) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  if (el) el.classList.add('active');
  const panel = document.getElementById('tab-'+name);
  if (panel) panel.classList.add('active');
  console.log(`[Tab] switched to: ${name}`);
}

function showTickerTab(ticker) {
  const tabId = 'ticker-' + ticker.replace('.', '_');
  const tab = document.querySelector(`.tab[data-tab="${tabId}"]`);
  showTab(tabId, tab);
  console.log(`[TickerTab] navigating to: ${ticker}`);
}
